services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: knrm
      POSTGRES_PASSWORD: knrm
      POSTGRES_DB: knrm
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knrm"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://knrm:knrm@db:5432/knrm
      JWT_SECRET: local-dev-secret
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
